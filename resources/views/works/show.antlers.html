<!-- start main wrapper -->
<div class="main-wrapper">

    <!-- start hero section -->
    {{ partial:page_builder/hero_section }}
    <!-- end hero section -->

    <!-- start gears section -->
    <section class="2xl:py-24 1xl:py-20 lg:py-16 py-14">
        <div class="container">
            <h2
                class="2xl:text-4xl xl:text-3xl text-2xl text-black uppercase leading-snug  md:mb-8 mb-5 md:pb-5 pb-3 border-b border-gray-100">
                {{ heading }}
            </h2>
            <div class="flex xl:flex-nowrap flex-wrap xl:gap-8 gap-4">
                <div class="xl:w-2/3 w-full xl:pr-12">
                    <p class="text-gray-400 lg:text-lg text-md">{{ description }}</p>
                </div>
                <div class="xl:w-1/3 w-full">
                    <ul class="pl-0 text-gray-400 lg:text-lg text-md space-y-4">
                        {{ short_information }}
                                {{ grid_field }}
                                    <li class="flex items-start gap-3"><img
                                            src="{{ theme:asset src="assets/img/badge-check.svg" }}" alt="img"
                                            class="lg:w-[24px] w-5 mt-1">
                                        <p class="mb-0"><span class="text-black font-medium">{{ title }}</span>
                                            {{ information }}
                                        </p>
                                    </li>
                                {{ /grid_field }}
                        {{ /short_information }}
                    </ul>
                </div>
            </div>
            <div class="mt-8 xl:columns-4 md:columns-3 columns-2 popup-gallery gap-4">
                {{ gallery }}
                    <a href="{{ url }}" title="Work detail" class=" mb-4 break-inside-avoid block w-full"><img
                            src="{{ url }}" alt="img" class="w-full "></a>
                {{ /gallery }}
            </div>
        </div>
    </section>
    <!-- end gears section -->


</div>

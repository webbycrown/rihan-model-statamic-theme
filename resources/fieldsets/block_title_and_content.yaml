title: 'Block Title And Content'
fields:
  -
    handle: blocks
    field:
      type: replicator
      display: Blocks
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            new_set:
              display: 'New Set'
              fields:
                -
                  handle: block_title
                  field:
                    type: text
                    display: 'Block Title'
                -
                  handle: block_content
                  field:
                    buttons:
                      - h2
                      - h3
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - removeformat
                      - quote
                      - anchor
                      - image
                      - table
                      - h1
                      - h4
                      - h5
                      - h6
                      - underline
                      - strikethrough
                      - small
                      - superscript
                      - subscript
                      - code
                      - codeblock
                      - horizontalrule
                      - alignleft
                      - aligncenter
                      - alignright
                      - alignjustify
                    remove_empty_nodes: false
                    type: bard
                    display: 'Block Content'

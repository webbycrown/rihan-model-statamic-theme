tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: your_name
            field:
              placeholder: 'Your Name'
              type: text
              display: Name
              validate:
                - required
          -
            handle: email
            field:
              placeholder: 'Email Address'
              type: text
              display: Email
              validate:
                - required
                - email
          -
            handle: phone_number
            field:
              placeholder: 'Phone Number'
              type: integer
              display: 'Phone Number'
          -
            handle: city
            field:
              placeholder: City
              type: text
              display: City
              validate:
                - required
          -
            handle: product_description
            field:
              placeholder: 'Product description'
              type: textarea
              display: 'Product description'
              validate:
                - required
          -
            handle: description
            field:
              options:
                -
                  key: '#'
                  value: 'Select Project Type'
                -
                  key: commercial_campaign
                  value: 'Commercial Campaign'
                -
                  key: editorial_shoot
                  value: 'Editorial Shoot'
                -
                  key: runway_presentation
                  value: 'Runway Presentation'
                -
                  key: brand_ambassadorship
                  value: 'Brand Ambassadorship'
              placeholder: 'Select Project Type'
              default: 'Select Project Type'
              type: select
              display: 'Project Type'
              validate:
                - required

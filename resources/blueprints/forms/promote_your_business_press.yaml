tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: your_name
            field:
              placeholder: 'Your Name'
              type: text
              display: 'Your Name'
              validate:
                - required
          -
            handle: company
            field:
              placeholder: Company
              type: text
              display: Company
              validate:
                - required
          -
            handle: email_address
            field:
              placeholder: 'Email Address'
              type: text
              display: 'Email Address'
              validate:
                - required
                - email
          -
            handle: phone_number
            field:
              placeholder: 'Phone Number'
              type: integer
              display: 'Phone Number'
              validate:
                - required
                - 'min:10'
                - 'max:10'
                - numeric
          -
            handle: role
            field:
              options:
                -
                  key: editorial_spread
                  value: 'Editorial Spread'
                -
                  key: commercial_campaign
                  value: 'Commercial Campaign'
                -
                  key: runway_presentation
                  value: 'Runway Presentation'
                -
                  key: brand_ambassadorship
                  value: 'Brand Ambassadorship'
                -
                  key: event_appearance
                  value: 'Event Appearance'
                -
                  key: digital_collaboration
                  value: 'Digital / Social Collaboration'
              default:
                - 'Editorial Spread'
                - editorial_spread
              type: checkboxes
              display: 'Project Category'
          -
            handle: budget
            field:
              placeholder: Budget
              type: text
              display: Budget
              validate:
                - required
          -
            handle: brief_enquiry
            field:
              placeholder: 'Brief Enquiry'
              type: textarea
              display: 'Brief Enquiry'
              validate:
                - required
